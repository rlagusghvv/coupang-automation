<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couplus · Preview</title>
    <link rel="stylesheet" href="/styles.css" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <main class="wrap">
      <header class="topbar">
        <div class="brand">
          <div class="logo">Couplus</div>
          <div class="tagline">자동 디깅 → 미리보기(업로드 전 검수)</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions">
            <a class="btn-link" href="/app/" target="_self" rel="noreferrer">앱으로</a>
            <a class="btn-link" href="/" target="_self" rel="noreferrer">대시보드</a>
          </div>
        </div>
      </header>

      <section class="view">
        <section class="dash-card" aria-label="세션">
          <div class="dash-head">
            <h2 class="dash-title">세션</h2>
            <div class="dash-sub" id="authStatus">확인 중…</div>
          </div>
          <div class="dash-body" id="authBody" style="display:none;">
            <div class="btn-row">
              <a class="btn-link" href="/" target="_self" rel="noreferrer">로그인 하러 가기(대시보드)</a>
              <a class="btn-link" href="/app/" target="_self" rel="noreferrer">앱으로</a>
            </div>
            <p class="hint">추천/미리보기는 로그인 세션이 필요합니다.</p>
          </div>
        </section>

        <section class="dash-card" aria-label="자동 디깅">
          <div class="dash-head">
            <h2 class="dash-title">자동 디깅(추천 후보)</h2>
            <div class="dash-sub">도매꾹/도매매 키워드로 후보를 쌓고, 업로드 전에 미리보기로 검수합니다.</div>
          </div>
          <div class="dash-body">
            <textarea id="keywords" rows="2" placeholder="키워드(쉼표/줄바꿈 구분). 비우면 기본 키워드셋 사용" style="width: 100%;"></textarea>
            <div class="btn-row" style="margin-top: 8px;">
              <button id="btnFill" type="button">후보 채우기</button>
              <button id="btnRefresh" type="button" class="ghost">목록 새로고침</button>
            </div>
            <p class="hint">각 후보는 ‘미리보기’를 눌러 쿠팡 업로드 전에 제목/가격/옵션/이미지를 확인하세요.</p>
            <div class="mini-card" id="recoList"></div>
          </div>
        </section>

        <section class="dash-card" aria-label="미리보기">
          <div class="dash-head">
            <h2 class="dash-title">미리보기</h2>
            <div class="dash-sub" id="previewSub">-</div>
          </div>
          <div class="dash-body">
            <label class="sr-only" for="url">상품 URL</label>
            <input id="url" type="url" placeholder="https://domeggook.com/..." inputmode="url" />
            <div class="btn-row">
              <button id="btnPreview" type="button" class="ghost">미리보기</button>
              <label style="display:flex; align-items:center; gap:8px; margin-left:8px;" class="hint">
                <input id="forceUpload" type="checkbox" />
                강제 재업로드
              </label>
              <button id="btnUpload" type="button">쿠팡 업로드</button>
            </div>

            <div class="mini-card hidden" id="previewCard">
              <div class="mini-title">쿠팡 업로드 미리보기</div>
              <div class="mini-kv" id="previewKv"></div>
            </div>

            <details style="margin-top: 12px;" id="rawWrap">
              <summary class="hint">원본 JSON 보기(디버그)</summary>
              <pre class="log" id="log" style="margin-top:12px; white-space:pre-wrap; word-break:break-word;"></pre>
            </details>
          </div>
        </section>
      </section>
    </main>

    <script src="/app/preview/preview.js?v=20260219-8"></script>
  </body>
</html>
